# Example only: replace HOST / PORT / TARGET before using nginx -t.
# PORT in listen is the frontend port; PORT in proxy_pass is the actual Go port.
server {
    listen PORT;
    server_name HOST;
    root TARGET; # Absolute path to frontend/dist.
    index index.html;

    client_max_body_size 34m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_request_buffering off;
    }

    location = /api {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
