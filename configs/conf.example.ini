[System]
LogLevel = info

[HTTP]
; 仅监听本机；0 表示让操作系统分配空闲端口，启动日志会显示实际地址。
Listen = 127.0.0.1:0
ShutdownTimeoutSeconds = 5

[Storage]
; 相对路径以本配置文件所在目录为基准，而不是终端工作目录。
; 这一段对应存储策略的 ConfigKey = local，也是新账号的初始上传位置。
LocalRoot = ../data

; 需要第二个本地目录时，为它建一条 StoragePolicy（ConfigKey = archive），
; 再在这里配置对应目录。已有策略不会被启动过程改指向别的目录。
; [StorageLocal]
; archive = ../data-archive

[Database]
; P2 会真正连接 MySQL。本地开发可以先执行 docker compose up -d。
Host = 127.0.0.1
Port = 3306
User = lucky
Password =
Name = luckycloudfile
; 密码不写进文件，通过环境变量 CLOUDREVE_DB_PASSWORD 传入。
; 本地 compose 的默认密码见 README。
