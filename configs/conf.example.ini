[System]
LogLevel = info

[HTTP]
; 仅监听本机；0 表示让操作系统分配空闲端口，启动日志会显示实际地址。
Listen = 127.0.0.1:0
ShutdownTimeoutSeconds = 5

[Upload]
; 单个分片会话同时处理多少个分片请求。限制的是“每个会话”，不是整个进程：
; 多个会话各自都可以达到这个上限。允许 1～8，默认 2。
; 超过上限的分片请求直接返回 409，不在服务端排队。
MaxParallelChunks = 2

[Task]
; ZIP 打包任务的并发 worker 数；每个 worker 同一时间只执行一个任务。
Workers = 2
; 等待队列长度，不包含正在执行的任务。任务先落库再入队，所以内存队列
; 暂时满不会让已经接收的任务失败，它会留在数据库里等下一次扫描。
QueueCapacity = 64
; 单个任务的最长执行时间（秒）。超时后 worker 会收到取消，但必须等任务
; 自己返回（完成清理）才会领取下一项。
TimeoutSeconds = 600
; 已完成 / 已失败的任务快照在内存中保留的秒数，超时后回收。
RetentionSeconds = 3600
; 已完成 / 已失败快照的数量上限；超过时先回收最早结束的记录。
; 只限制排队任务并不足以保证长期运行的内存有界，所以终态记录也要有上限。
MaxTerminalRecords = 10000
; 数据库中未终态任务（queued / running / retry_wait）的总数上限。
; 它限制持久化积压；达到上限后新提交在落库之前返回 503 task_limit。
MaxPendingTasks = 1000
; 调度器周期扫描到期任务的间隔（秒）。提交后的唤醒通知丢失时，
; 任务最迟会在这个间隔内被重新发现。
ScanIntervalSeconds = 5
; 单次扫描最多取回多少条到期任务，避免一次读入无限积压。
ScanBatchSize = 50
; 可恢复 ZIP 的任务工作目录：.partial 和完整产物都放在这里，路径会写进
; 数据库检查点。相对路径同样以本配置文件所在目录为基准；不要指向系统临时目录，
; 否则重启或临时目录被清理后，phase=publish 的完整产物会丢失。
WorkDir = ../data-tasks

[Worker]
; 独立 worker（cmd/worker）的参数。API 进程不读取这一段。
; 一台机器上启动多个 worker 时，用 --id 或环境变量区分标识；
; 留空时使用 hostname-pid。
; ID = worker-a
; 同时执行的任务数。每次只领取空闲槽位数量，不会先领一大堆再排队。
Slots = 2
; 一次领取的租约时长（秒）。worker 停止心跳后，其他实例要等这么久才能接管。
LeaseSeconds = 30
; 续租间隔（秒），必须小于 LeaseSeconds。
HeartbeatSeconds = 10
; 空闲时重新查询可领取任务的间隔（秒）。
PollSeconds = 2

[Storage]
; 相对路径以本配置文件所在目录为基准，而不是终端工作目录。
; 这一段对应存储策略的 ConfigKey = local，也是新账号的初始上传位置。
LocalRoot = ../data

; 需要第二个本地目录时，为它建一条 StoragePolicy（ConfigKey = archive），
; 再在这里配置对应目录。已有策略不会被启动过程改指向别的目录。
; [StorageLocal]
; archive = ../data-archive

[Database]
; P2 会真正连接 MySQL。本地开发可以先执行 docker compose up -d。
Host = 127.0.0.1
Port = 3306
User = lucky
Password =
Name = luckycloudfile
; 密码不写进文件，通过环境变量 CLOUDREVE_DB_PASSWORD 传入。
; 本地 compose 的默认密码见 README。
