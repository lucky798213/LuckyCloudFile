[System]
LogLevel = info

[HTTP]
; 仅监听本机；0 表示让操作系统分配空闲端口，启动日志会显示实际地址。
Listen = 127.0.0.1:0
ShutdownTimeoutSeconds = 5

[Upload]
; 单个分片会话同时处理多少个分片请求。限制的是“每个会话”，不是整个进程：
; 多个会话各自都可以达到这个上限。允许 1～8，默认 2。
; 超过上限的分片请求直接返回 409，不在服务端排队。
MaxParallelChunks = 2

[Task]
; ZIP 打包任务的并发 worker 数；每个 worker 同一时间只执行一个任务。
Workers = 2
; 等待队列长度，不包含正在执行的任务。队列满时提交返回 503 queue_full。
QueueCapacity = 64
; 单个任务的最长执行时间（秒）。超时后 worker 会收到取消，但必须等任务
; 自己返回（完成清理）才会领取下一项。
TimeoutSeconds = 600
; 已完成 / 已失败的任务快照在内存中保留的秒数，超时后回收。
RetentionSeconds = 3600
; 已完成 / 已失败快照的数量上限；超过时先回收最早结束的记录。
; 只限制排队任务并不足以保证长期运行的内存有界，所以终态记录也要有上限。
MaxTerminalRecords = 10000

[Storage]
; 相对路径以本配置文件所在目录为基准，而不是终端工作目录。
; 这一段对应存储策略的 ConfigKey = local，也是新账号的初始上传位置。
LocalRoot = ../data

; 需要第二个本地目录时，为它建一条 StoragePolicy（ConfigKey = archive），
; 再在这里配置对应目录。已有策略不会被启动过程改指向别的目录。
; [StorageLocal]
; archive = ../data-archive

[Database]
; P2 会真正连接 MySQL。本地开发可以先执行 docker compose up -d。
Host = 127.0.0.1
Port = 3306
User = lucky
Password =
Name = luckycloudfile
; 密码不写进文件，通过环境变量 CLOUDREVE_DB_PASSWORD 传入。
; 本地 compose 的默认密码见 README。
