[System]
LogLevel = info

[HTTP]
; 仅监听本机；0 表示让操作系统分配空闲端口，启动日志会显示实际地址。
Listen = 127.0.0.1:0
ShutdownTimeoutSeconds = 5

[Storage]
; 相对路径以本配置文件所在目录为基准，而不是终端工作目录。
LocalRoot = ../data

[Database]
; P2 会真正连接 MySQL。本地开发可以先执行 docker compose up -d。
Host = 127.0.0.1
Port = 3306
User = lucky
Password =
Name = luckycloudfile
; 密码不写进文件，通过环境变量 CLOUDREVE_DB_PASSWORD 传入。
; 本地 compose 的默认密码见 README。
