[System]
LogLevel = info

[HTTP]
; 仅监听本机；0 表示让操作系统分配空闲端口，启动日志会显示实际地址。
Listen = 127.0.0.1:0
ShutdownTimeoutSeconds = 5

[Storage]
; 相对路径以本配置文件所在目录为基准，而不是终端工作目录。
LocalRoot = ../data

[Database]
; P0 仅解析这些字段，不连接数据库，不要求安装 MySQL。
Host = HOST
Port = 3306
User = DB_USER
Password =
Name = DB_NAME
; 真正使用数据库时，密码通过 CLOUDREVE_DB_PASSWORD 环境变量传入。
